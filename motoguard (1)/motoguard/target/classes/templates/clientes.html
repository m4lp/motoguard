<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: minhaEstrutura(~{::section})}">
<body>
<section>
    <div class="info-panel">
        <h2>O que e o MotoGuard?</h2>
        <p>
            O MotoGuard e um sistema de gerenciamento criado para organizar clientes e motos em
            um unico ambiente, facilitando o controle das informacoes e o acompanhamento da frota.
        </p>
    </div>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card">
                <h4 class="mb-4">Novo Cliente</h4>
                <form th:action="@{/clientes/salvar}" method="post">
                    <div class="mb-2">
                        <input class="form-control" name="nome" placeholder="Nome completo" required>
                    </div>
                    <div class="mb-2">
                        <input class="form-control" name="cpf" placeholder="CPF" required>
                    </div>
                    <div class="mb-2">
                        <input class="form-control" name="email" placeholder="Email">
                    </div>
                    <div class="mb-3">
                        <input class="form-control" name="telefone" placeholder="Telefone">
                    </div>
                    <button class="btn btn-primary w-100">Cadastrar Cliente</button>
                </form>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card">
                <h4 class="mb-4 text-primary">Base de Clientes</h4>
                <table class="table table-hover">
                    <thead>
                    <tr class="text-muted small">
                        <th>Nome</th>
                        <th>Contato</th>
                        <th>Acoes</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${clientes}">
                        <td th:text="${c.nome}" class="fw-bold"></td>
                        <td>
                            <span th:text="${c.email}" class="d-block small"></span>
                            <span th:text="${c.telefone}" class="text-muted small"></span>
                        </td>
                        <td>
                            <a th:href="@{/clientes/deletar/{id}(id=${c.id})}"
                               class="btn btn-outline-danger btn-sm">Excluir</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
</body>
</html>
