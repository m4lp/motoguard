<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: minhaEstrutura(~{::section})}">
<body>
<section>
    <div class="row g-4 mb-2">
        <div class="col-md-4">
            <div class="card">
                <div class="stat-label">Clientes cadastrados</div>
                <div class="stat-value" th:text="${totalClientes}">0</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="stat-label">Motos cadastradas</div>
                <div class="stat-value" th:text="${totalMotos}">0</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="stat-label">Media de motos por cliente</div>
                <div class="stat-value" th:text="${#numbers.formatDecimal(mediaMotosPorCliente, 1, 2)}">0,00</div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card">
                <h4 class="mb-4 text-primary">Clientes</h4>
                <table class="table table-hover">
                    <thead>
                    <tr class="text-muted small">
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Contato</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${clientes}">
                        <td th:text="${c.nome}"></td>
                        <td th:text="${c.cpf}"></td>
                        <td>
                            <span th:text="${c.email}" class="d-block small"></span>
                            <span th:text="${c.telefone}" class="small text-muted"></span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(clientes)}">
                        <td colspan="3" class="text-muted">Nenhum cliente cadastrado.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card">
                <h4 class="mb-4 text-primary">Motos</h4>
                <table class="table table-hover">
                    <thead>
                    <tr class="text-muted small">
                        <th>Modelo</th>
                        <th>Placa</th>
                        <th>Dono</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="m : ${motos}">
                        <td th:text="${m.modelo}"></td>
                        <td th:text="${m.placa}"></td>
                        <td th:text="${m.cliente?.nome}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(motos)}">
                        <td colspan="3" class="text-muted">Nenhuma moto cadastrada.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
</body>
</html>
