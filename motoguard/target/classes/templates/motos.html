<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: minhaEstrutura(~{::section})}">
<body>
<section>
    <div class="info-panel">
        <h2>O que e o MotoGuard?</h2>
        <p>
            O MotoGuard e um sistema de gerenciamento criado para organizar clientes e motos em
            um unico ambiente, facilitando o controle das informacoes e o acompanhamento da frota.
        </p>
    </div>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card">
                <h4 class="mb-4">Nova Moto</h4>
                <form th:action="@{/motos/salvar}" method="post">
                    <input class="form-control mb-2" name="modelo" placeholder="Modelo" required>
                    <input class="form-control mb-2" name="placa" placeholder="Placa" required>
                    <input class="form-control mb-2" name="cor" placeholder="Cor">
                    <input class="form-control mb-2" name="ano" type="number" placeholder="Ano">
                    <select class="form-select mb-3" name="clienteId" required>
                        <option value="">Selecione o dono</option>
                        <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"></option>
                    </select>
                    <button class="btn btn-primary w-100">Salvar</button>
                </form>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card">
                <h4 class="mb-4 text-primary">Frota</h4>
                <table class="table table-hover">
                    <thead>
                    <tr class="text-muted small">
                        <th>Modelo</th>
                        <th>Placa</th>
                        <th>Cor</th>
                        <th>Ano</th>
                        <th>Dono</th>
                        <th>Acoes</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="m : ${motos}">
                        <td th:text="${m.modelo}"></td>
                        <td th:text="${m.placa}"></td>
                        <td th:text="${m.cor}"></td>
                        <td th:text="${m.ano}"></td>
                        <td th:text="${m.cliente?.nome}"></td>
                        <td>
                            <a th:href="@{/motos/deletar/{id}(id=${m.id})}"
                               class="btn btn-outline-danger btn-sm">Excluir</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
</body>
</html>
