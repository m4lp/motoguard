<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" th:fragment="minhaEstrutura(conteudo)">
<head>
  <meta charset="UTF-8">
  <title th:text="${title} ?: 'MotoGuard'">MotoGuard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    html, body { min-height: 100%; }
    body {
      background: #111827;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .navbar {
      background: #020617;
      border-bottom: 1px solid #334155;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
    }
    .navbar-brand, .link-light { color: #fff !important; }
    .card {
      background: #243244;
      border: 1px solid #3f5168;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, .16);
    }
    .card h4 {
      color: #ffffff;
      font-weight: 800;
    }
    .info-panel {
      background: #1e3a5f;
      border: 1px solid #60a5fa;
      border-radius: 8px;
      padding: 22px;
      margin-bottom: 24px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, .16);
    }
    .info-panel h2 {
      color: #ffffff;
      font-size: 1.55rem;
      font-weight: 900;
      margin-bottom: 8px;
    }
    .info-panel p {
      color: #f8fafc;
      margin-bottom: 0;
      max-width: 860px;
    }
    .form-control, .form-select {
      background-color: #0f172a;
      border: 1px solid #64748b;
      color: #fff;
    }
    .form-control:focus, .form-select:focus {
      background-color: #111827;
      border-color: #60a5fa;
      color: #fff;
      box-shadow: 0 0 0 .2rem rgba(96, 165, 250, .22);
    }
    .form-control::placeholder { color: #e2e8f0; opacity: .82; }
    .btn-primary { background: #1d4ed8; border: none; }
    .btn-primary:hover { background: #2563eb; }
    .text-muted { color: #f1f5f9 !important; opacity: .82; }
    .text-primary { color: #93c5fd !important; }
    .table {
      --bs-table-bg: transparent;
      --bs-table-color: #f8fafc;
      --bs-table-hover-color: #fff;
      --bs-table-hover-bg: rgba(147, 197, 253, .12);
      --bs-table-border-color: #475569;
    }
    .stat-value {
      color: #ffffff;
      font-size: 2.6rem;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 2px 12px rgba(0, 0, 0, .25);
    }
    .stat-label { color: #ffffff; font-weight: 700; opacity: .95; }
    .page-content { flex: 1; }
    footer {
      color: #fff;
      background: #020617;
      border-top: 1px solid #334155;
      margin-top: auto;
    }
  </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3">
  <a class="navbar-brand fw-bold" href="/">MotoGuard</a>
  <div class="d-flex gap-3 align-items-center">
    <a class="link-light text-decoration-none" href="/clientes">Clientes</a>
    <a class="link-light text-decoration-none" href="/motos">Motos</a>
    <a class="link-light text-decoration-none" href="/relatorio">Relatorio</a>
    <form th:action="@{/logout}" method="post" class="m-0">
      <button class="btn btn-outline-light btn-sm" type="submit">Sair</button>
    </form>
  </div>
</nav>

<div class="container mt-5 page-content">
  <main th:replace="${conteudo}"></main>
</div>

<footer class="text-center small py-4">
  MotoGuard &copy; 2026. Todos os direitos reservados.
</footer>
</body>
</html>
